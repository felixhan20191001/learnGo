<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡️ 勇士抽奖系统 ⚡️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #00fff2;
            --secondary: #ff00de;
            --danger: #ff4757;
            --bg-dark-overlay: rgba(15, 15, 26, 0.25);
            --panel-bg: rgba(26, 26, 46, 0.85);
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('image_0.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .avatar-left {
            position: fixed; top: 30px; left: 30px; width: 150px; height: auto;
            border-radius: 50%; border: 3px solid var(--primary);
            box-shadow: 0 0 30px rgba(0, 255, 242, 0.5); z-index: 100; transition: transform 0.3s;
        }
        .avatar-left:hover { transform: scale(1.05) rotate(-5deg); }

        .draw-section {
            padding: 50px 0; text-align: center; width: 100%;
            background: var(--bg-dark-overlay); box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            padding-top: 80px; margin-bottom: 40px;
        }

        h1 {
            font-size: 3.5rem; margin: 0 0 20px 0; letter-spacing: 5px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 242, 0.3);
        }

        .operator-wrapper { margin-bottom: 20px; display: flex; justify-content: center; }
        .operator-input {
            background: rgba(0, 0, 0, 0.6); border: 2px solid var(--secondary);
            color: #fff; padding: 12px 20px; font-size: 1.2rem;
            border-radius: 30px; width: 250px; text-align: center; outline: none;
            transition: all 0.3s; box-shadow: 0 0 10px rgba(255, 0, 222, 0.2);
        }
        .operator-input:focus { box-shadow: 0 0 20px rgba(255, 0, 222, 0.6); border-color: #fff; }

        .setting-row {
            margin-bottom: 25px; display: flex; justify-content: center; gap: 30px;
            background: rgba(0,0,0,0.3); padding: 10px 20px; display: inline-flex; border-radius: 20px;
        }
        .radio-label {
            cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; transition: color 0.2s;
        }
        .radio-label:hover { color: var(--primary); }
        .radio-label input[type="radio"] {
            transform: scale(1.4); accent-color: var(--secondary); cursor: pointer;
        }

        .btn-draw {
            background: linear-gradient(135deg, var(--secondary), #9900ff);
            color: white; border: none; padding: 15px 50px; font-size: 1.5rem;
            border-radius: 50px; cursor: pointer; box-shadow: 0 0 25px rgba(255, 0, 222, 0.4);
            transition: transform 0.2s, box-shadow 0.2s; font-weight: bold; margin-bottom: 30px;
        }
        .btn-draw:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 0, 222, 0.7); }
        .btn-draw:disabled { filter: grayscale(1); cursor: not-allowed; transform: none; }

        .stage { display: flex; justify-content: center; gap: 30px; perspective: 1000px; }
        .card {
            width: 220px; height: 220px;
            background: rgba(255, 255, 255, 0.05); border: 2px solid #444; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.3s; backdrop-filter: blur(5px);
        }
        .card.active {
            border-color: var(--primary); background: rgba(0, 255, 242, 0.15);
            box-shadow: 0 0 50px var(--primary); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .congrats-text {
            font-size: 2.5rem; font-weight: 900; color: #ffd700;
            margin-top: 40px; opacity: 0; transform: translateY(20px);
            transition: all 0.5s ease-out; text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }
        .congrats-text.show { opacity: 1; transform: translateY(0); }

        .bottom-container { display: flex; width: 90%; max-width: 1200px; gap: 30px; align-items: flex-start; margin-bottom: 50px; }
        .glass-panel {
            flex: 1; background: var(--panel-bg); border-radius: 15px; padding: 25px;
            border: 1px solid rgba(0, 255, 242, 0.2); box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); min-height: 450px; display: flex; flex-direction: column;
        }
        .section-title {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; margin-bottom: 15px; margin-top: 0;
            font-size: 1.4rem; color: var(--primary); display: flex; justify-content: space-between; align-items: center;
        }
        .section-title-left { display: flex; align-items: center; gap: 15px; }

        .name-list { display: flex; flex-wrap: wrap; gap: 10px; overflow-y: auto; padding-right: 5px; flex-grow: 1; align-content: flex-start; max-height: 250px; }
        .name-tag {
            background: rgba(45, 45, 68, 0.8); padding: 8px 15px; border-radius: 20px;
            display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s; font-size: 1rem;
        }
        .name-tag:hover { border-color: var(--primary); transform: translateY(-2px); background: rgba(61, 61, 92, 0.9); }
        .delete-btn { color: #ff6b6b; cursor: pointer; font-weight: bold; font-size: 1.2rem; }
        .delete-btn:hover { color: red; }

        .history-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .history-item {
            display: flex; justify-content: space-between; align-items: center; padding: 10px 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.95rem; animation: fadeIn 0.5s ease;
        }
        .history-item:first-child { background: rgba(0, 255, 242, 0.05); }
        .history-time { color: #888; font-size: 0.85em; width: 140px; }
        .history-operator { color: var(--secondary); font-weight: bold; margin-right: 5px; }
        .history-winners { color: #ffd700; font-weight: bold; text-align: right; flex-grow: 1; }

        .input-group { display: flex; gap: 5px; }
        .input-group input { padding: 8px; border-radius: 5px; border: 1px solid #444; background: rgba(0,0,0,0.5); color: white; outline: none; width: 120px; }
        .btn-add { padding: 8px 15px; background: var(--primary); color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }

        .btn-clear-all {
            background: rgba(255, 71, 87, 0.1); border: 1px solid var(--danger); color: var(--danger);
            padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
            display: flex; align-items: center; gap: 5px;
        }
        .btn-clear-all:hover { background: var(--danger); color: white; box-shadow: 0 0 10px var(--danger); }

        .batch-import-area { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .batch-textarea {
            width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.4); color: #ddd; border: 1px solid #555;
            border-radius: 8px; padding: 10px; resize: vertical; font-family: inherit; margin-bottom: 8px; outline: none; transition: border-color 0.3s;
        }
        .batch-textarea:focus { border-color: var(--primary); color: #fff; }
        .btn-batch { width: 100%; padding: 10px; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--primary); color: var(--primary); border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-batch:hover { background: var(--primary); color: #000; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 900px) {
            .bottom-container { flex-direction: column; }
            .glass-panel { width: 100%; box-sizing: border-box; }
            .card { width: 140px; height: 140px; font-size: 1.5rem; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<img src="image_1.jpg" alt="全村的希望" class="avatar-left">

<div class="draw-section">
    <h1>🎲 勇士抽奖系统 🎲</h1>

    <div class="operator-wrapper">
        <input type="text" id="operatorName" class="operator-input" placeholder="✨ 请输入抽奖人姓名 ✨">
    </div>

    <div class="setting-row">
        <label class="radio-label">
            <input type="radio" name="drawCount" value="1" onchange="updateCardDisplay()">
            <span>🦄 独行大侠</span>
        </label>
        <label class="radio-label">
            <input type="radio" name="drawCount" value="2" checked onchange="updateCardDisplay()">
            <span>🎎 出双入对</span>
        </label>
    </div>

    <button class="btn-draw" id="startBtn" onclick="startLottery()">开启命运轮盘</button>

    <div class="stage">
        <div class="card" id="card1"><span>?</span></div>
        <div class="card" id="card2"><span>?</span></div>
    </div>

    <div id="finalText" class="congrats-text">🎉 恭喜勇士诞生！ 🎉</div>
</div>

<div class="bottom-container">
    <div class="glass-panel">
        <h3 class="section-title">
            <div class="section-title-left">
                <span>👥 候选人 (<span id="count">0</span>)</span>
                <button class="btn-clear-all" onclick="clearAllNames()" title="清空所有候选人">🗑️ 清空</button>
            </div>
            <div class="input-group">
                <input type="text" id="newName" placeholder="姓名" onkeypress="if(event.keyCode==13) addName()">
                <button class="btn-add" onclick="addName()">新增</button>
            </div>
        </h3>
        <div class="name-list" id="nameListContainer"></div>

        <div class="batch-import-area">
            <textarea id="batchNames" class="batch-textarea" rows="3" placeholder="在此粘贴名单，支持批量导入 (一行一个姓名)..."></textarea>
            <button class="btn-batch" onclick="addBatchNames()">⬇️ 批量导入名单</button>
        </div>
    </div>

    <div class="glass-panel">
        <h3 class="section-title">📜 历史记录</h3>
        <ul class="history-list" id="historyList">
            <li style="text-align: center; color: #666; padding: 20px;">暂无历史记录</li>
        </ul>
    </div>
</div>

<script>
    let isRolling = false;
    let candidateList = [];
    let currentHistoryCount = -1;

    window.onload = function() {
        refreshList();
        loadHistory();
        setInterval(loadHistory, 3000);
        updateCardDisplay();
    };

    // 【核心修改】切换时重置所有显示结果
    function updateCardDisplay() {
        const countRadios = document.getElementsByName('drawCount');
        let drawCount = 2;
        for (const r of countRadios) {
            if (r.checked) drawCount = parseInt(r.value);
        }

        const card1 = document.getElementById('card1');
        const card2 = document.getElementById('card2');
        const finalText = document.getElementById('finalText');

        // 1. 重置高亮状态和结果文字
        finalText.classList.remove('show');
        card1.classList.remove('active');
        card2.classList.remove('active');

        // 2. 将卡片内容重置回 "?"
        card1.querySelector('span').innerText = '?';
        card2.querySelector('span').innerText = '?';

        // 3. 控制卡片显示
        if (drawCount === 1) {
            card2.style.display = 'none';
        } else {
            card2.style.display = 'flex';
        }
    }

    async function refreshList() {
        try {
            const res = await fetch('/api/list');
            const data = await res.json();
            if (data.success) {
                candidateList = data.names || [];
                renderList(candidateList);
            }
        } catch (e) { console.error(e); }
    }

    function renderList(names) {
        const container = document.getElementById('nameListContainer');
        document.getElementById('count').innerText = names.length;
        container.innerHTML = '';
        names.forEach(name => {
            const tag = document.createElement('div');
            tag.className = 'name-tag';
            tag.innerHTML = `${name} <span class="delete-btn" onclick="deleteName('${name}')">&times;</span>`;
            container.appendChild(tag);
        });
    }

    async function addName() {
        const input = document.getElementById('newName');
        const name = input.value.trim();
        if (!name) return;
        const res = await fetch('/api/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name: name })
        });
        const data = await res.json();
        if (data.success) {
            input.value = '';
            candidateList = data.names;
            renderList(candidateList);
        } else { alert(data.msg); }
    }

    async function addBatchNames() {
        const textarea = document.getElementById('batchNames');
        const text = textarea.value;
        if (!text.trim()) { alert("请先在文本框中粘贴名单！"); return; }
        const names = text.split(/\r?\n/).map(n => n.trim()).filter(n => n);
        if (names.length === 0) return;
        try {
            const res = await fetch('/api/batch_add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ names: names })
            });
            const data = await res.json();
            if (data.success) {
                alert(data.msg);
                textarea.value = '';
                candidateList = data.names;
                renderList(candidateList);
            } else { alert("导入失败: " + data.msg); }
        } catch (e) { console.error(e); alert("网络请求失败"); }
    }

    async function clearAllNames() {
        if (!confirm("⚠️ 高能预警 ⚠️\n\n确定要【清空所有候选人】吗？\n此操作将删除当前列表中的所有人，且不可恢复！")) return;
        try {
            const res = await fetch('/api/clear', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                candidateList = [];
                renderList(candidateList);
                alert("🗑️ 名单已全部清空！");
            } else { alert("清空失败: " + data.msg); }
        } catch(e) { console.error(e); alert("网络请求失败"); }
    }

    async function deleteName(name) {
        if (!confirm(`确定要移除 "${name}" 吗？`)) return;
        const res = await fetch('/api/del', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name: name })
        });
        const data = await res.json();
        if (data.success) {
            candidateList = data.names;
            renderList(candidateList);
        }
    }

    async function startLottery() {
        if (isRolling) return;

        const operatorInput = document.getElementById('operatorName');
        const operatorName = operatorInput.value.trim();
        if (!operatorName) {
            alert("⚠️ 请输入抽奖人姓名！");
            operatorInput.focus();
            return;
        }

        const countRadios = document.getElementsByName('drawCount');
        let drawCount = 2;
        for (const r of countRadios) { if (r.checked) drawCount = parseInt(r.value); }

        if (candidateList.length < drawCount) {
            alert(`名单不足 ${drawCount} 人，无法开启！`);
            return;
        }

        document.getElementById('finalText').classList.remove('show');
        const card1 = document.getElementById('card1');
        const card2 = document.getElementById('card2');

        card1.classList.remove('active');
        card2.classList.remove('active');

        // 确保抽奖开始前也同步一次显示状态
        updateCardDisplay();

        try {
            const res = await fetch('/api/draw', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ operator: operatorName, count: drawCount })
            });
            const data = await res.json();

            if (data.error) {
                alert(data.error);
                return;
            }

            isRolling = true;
            document.getElementById('startBtn').disabled = true;

            const span1 = card1.querySelector('span');
            const span2 = card2.querySelector('span');

            let rollTimer = setInterval(() => {
                const r1 = Math.floor(Math.random() * candidateList.length);
                span1.innerText = candidateList[r1];

                if (drawCount === 2) {
                    const r2 = Math.floor(Math.random() * candidateList.length);
                    span2.innerText = candidateList[r2];
                }
            }, 60);

            setTimeout(() => {
                clearInterval(rollTimer);

                span1.innerText = data.winners[0];
                if (drawCount > 1) {
                    span2.innerText = data.winners[1];
                }

                card1.classList.add('active');
                if (drawCount > 1) {
                    card2.classList.add('active');
                }

                document.getElementById('finalText').classList.add('show');
                fireConfetti();
                isRolling = false;
                document.getElementById('startBtn').disabled = false;
                loadHistory(true);

            }, 3000);

        } catch(e) {
            console.error(e);
            alert("网络错误");
            isRolling = false;
        }
    }

    async function loadHistory(force = false) {
        if (isRolling && !force) { return; }
        try {
            const res = await fetch('/api/history');
            let data = await res.json();
            if (!data) data = [];

            if (data.length === currentHistoryCount) return;
            currentHistoryCount = data.length;

            const list = document.getElementById("historyList");
            list.innerHTML = "";

            if (data.length === 0) {
                list.innerHTML = '<li style="text-align: center; color: #666; padding: 20px;">暂无历史记录</li>';
                return;
            }

            for (let i = data.length - 1; i >= 0; i--) {
                const item = data[i];
                const li = document.createElement("li");
                li.className = "history-item";
                li.innerHTML = `
                    <div>
                        <span class="history-time">[${item.time}]</span>
                        <span class="history-operator">上帝*${item.operator}*抽中了</span>
                    </div>
                    <div class="history-winners">
                        🏆 ${item.winners.join(" & ")}
                    </div>
                `;
                list.appendChild(li);
            }
        } catch(e) { console.error(e); }
    }

    function fireConfetti() {
        var count = 300;
        var defaults = { origin: { y: 0.6 } };
        function fire(particleRatio, opts) {
            confetti(Object.assign({}, defaults, opts, {
                particleCount: Math.floor(count * particleRatio)
            }));
        }
        fire(0.25, { spread: 26, startVelocity: 55 });
        fire(0.2, { spread: 60 });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45 });
    }
</script>
</body>
</html>
